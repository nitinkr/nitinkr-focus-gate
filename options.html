<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Gate Settings</title><link rel="stylesheet" href="popup.css"></head><body><main>
<header><div class="mark">FG</div><div><h1>Focus Gate</h1><p>Make your browsing intentional.</p></div></header>
<section><h2>Sites</h2><div id="sites"></div><form id="site-form" class="add"><input id="domain" placeholder="example.com" required><select id="mode"><option value="always">Always block</option><option value="limit">Daily limit</option></select><span id="limit-wrap" hidden><input id="limit" type="number" min="1" max="1440" value="30" aria-label="Daily minutes"><small>min/day</small></span><button aria-label="Add site">+</button></form><p class="hint">Always blocked sites can be unblocked with the switch. Daily limit sites redirect after their allowance is used.</p></section>
<section><h2>Random redirect pool</h2><textarea id="destinations" rows="4" placeholder="One URL per line"></textarea><p class="hint">Blocked visits go to a randomly selected URL in this list.</p></section>
<footer><span id="status">Saved automatically</span><button id="save">Save changes</button></footer></main><script src="options.js"></script></body></html>
